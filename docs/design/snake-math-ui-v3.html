<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake & Math — UI Design v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<!--
  Snake & Math — UI design v3 (phone home + phone MDAS gameplay)
  Art direction: lively, glossy, bright jungle, inspired by the "Snake Garden" concept.
  All artwork is original vector drawn here; no reference art reused.
  ?screen=phone-home | phone-game renders one screen full-bleed (PNG export).
-->
<style>
:root{
  --jungle-top:#4f9f3d; --jungle-mid:#2f7a31; --jungle-low:#1c5a25;
  --panel:rgba(9,38,14,.58); --panel-line:rgba(205,255,150,.28);
  --lime-hi:#d4f77c; --lime:#93db45; --lime-lo:#5fae2c; --lime-edge:#3f7f20;
  --sun-hi:#ffe680; --sun:#ffc531; --sun-lo:#f39a1e; --sun-edge:#b8620f;
  --gold:#ffd95a; --cream:#fff6dc; --ink:#173f17; --ink-soft:#2f5a26;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#dfe8d8;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
svg{display:block;overflow:visible}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.doc-head{max-width:1100px;margin:0 auto;padding:44px 32px 0}
.doc-head h1{font:600 32px/1.1 var(--display)}
.doc-head p{margin-top:8px;max-width:720px;color:#43584a;font-size:15px;line-height:1.55}
.row{max-width:1100px;margin:0 auto;padding:32px;display:flex;flex-wrap:wrap;gap:48px}
figure{display:flex;flex-direction:column;gap:12px}
figcaption{font-size:13px;color:#4c6152;font-weight:800}

/* ---------- Screen shell ---------- */
.screen{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;color:var(--cream);
  background:linear-gradient(180deg,var(--jungle-top) 0%,var(--jungle-mid) 48%,var(--jungle-low) 100%);
  box-shadow:0 30px 60px -20px rgba(10,40,15,.5),0 0 0 1px rgba(10,40,15,.1)}
.layer{position:absolute;inset:0;pointer-events:none}
.bg{z-index:0}.fg{z-index:3}
.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column}
.status{position:absolute;inset:0 0 auto;height:42px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;font:800 15px/1 var(--body);color:#fff;z-index:5;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.pill{position:absolute;left:50%;bottom:9px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.8);transform:translateX(-50%);z-index:6}

/* ---------- Buttons ---------- */
.round-btn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative}
.round-btn.dark{background:radial-gradient(circle at 35% 30%,#2f6a2c,#123d17);box-shadow:0 0 0 2.5px rgba(205,255,150,.45),0 5px 0 #0c2c10,0 10px 18px rgba(0,0,0,.3);color:var(--cream)}
.round-btn.lime{background:radial-gradient(circle at 35% 28%,#efffb0,var(--lime) 55%,var(--lime-lo));box-shadow:0 0 0 2.5px #1f5418,0 5px 0 #1f5418,0 10px 18px rgba(0,0,0,.3),inset 0 -4px 0 rgba(0,0,0,.08);color:#1b4416}
.round-btn::after{content:"";position:absolute;left:22%;top:12%;width:46%;height:26%;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(1px)}

.big-btn{position:relative;width:100%;height:78px;border-radius:26px;display:flex;align-items:center;gap:14px;padding:0 14px 0 12px;text-align:left;overflow:hidden}
.big-btn::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:30px;border-radius:20px 20px 40px 40px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none}
.big-btn.lime{background:linear-gradient(180deg,#d9f98c 0%,#a6e352 45%,#79c934 100%);box-shadow:0 0 0 3px #1f5418,0 7px 0 #1f5418,0 14px 24px rgba(0,0,0,.35);color:#173f12}
.big-btn.sun{background:linear-gradient(180deg,#fff0a0 0%,#ffcf3d 45%,#f5a023 100%);box-shadow:0 0 0 3px #6b3608,0 7px 0 #6b3608,0 14px 24px rgba(0,0,0,.35);color:#4a2604}
.bicon{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fffef5,#fff2c9);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 0 0 2.5px rgba(0,0,0,.18)}
.btxt{flex:1;display:flex;flex-direction:column;gap:3px;position:relative}
.btxt b{font:700 25px/1 var(--display);letter-spacing:.005em;text-shadow:0 2px 0 rgba(255,255,255,.45)}
.btxt small{font:800 13px/1.2 var(--body);opacity:.78}
.bplay{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative}
.lime .bplay{background:#1f5418;color:var(--lime-hi)}
.sun .bplay{background:#6b3608;color:var(--sun-hi)}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:0 5px;font:700 20px/1 var(--display);color:#b4610c;text-align:center}
.ops span:nth-child(2n){color:#2f7a31}

/* ---------- Home ---------- */
.home{align-items:center;padding:50px 20px 30px}
.home .settings{position:absolute;top:52px;right:18px;z-index:4}
.logo{width:300px;height:132px;margin-top:22px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.tagline{display:flex;align-items:center;gap:10px;margin-top:6px;font:900 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:#fff4c4;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tagline::before,.tagline::after{content:"";width:26px;height:2.5px;border-radius:2px;background:#fff4c4;opacity:.7}
.hero{width:356px;height:294px;margin-top:12px}
.modes{width:100%;display:flex;flex-direction:column;gap:16px;margin-top:4px}
.best-card{width:100%;margin-top:18px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel-line),0 8px 18px rgba(0,0,0,.2)}
.best-card .lbl{font:900 11px/1.2 var(--body);letter-spacing:.14em;color:var(--lime-hi)}
.best-card .cols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.best-card .col{display:flex;flex-direction:column;gap:3px;padding-left:12px;border-left:2px solid rgba(205,255,150,.18)}
.best-card .col span{font:800 11px/1 var(--body);letter-spacing:.08em;opacity:.8}
.best-card .col b{font:700 24px/1 var(--display);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3)}

/* ---------- Game ---------- */
.game{padding:48px 16px 28px}
.gbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.mini-logo{width:104px;height:48px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.scores{height:52px;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel-line);display:grid;grid-template-columns:1fr 1fr;align-items:center}
.scores div{display:flex;flex-direction:column;align-items:center;gap:3px}
.scores div+div{border-left:2px solid rgba(205,255,150,.18)}
.scores span{font:900 10px/1 var(--body);letter-spacing:.14em;color:var(--lime-hi)}
.scores b{font:700 22px/1 var(--display);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.lives{margin-top:12px;height:42px;border-radius:21px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel-line);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px}
.lives .lbl{font:900 11px/1 var(--body);letter-spacing:.16em;color:var(--lime-hi)}
.hearts{display:flex;gap:5px}
.hearts svg{width:27px;height:27px}

.qcard{position:relative;margin-top:22px;padding:20px 12px 12px;border-radius:24px;text-align:center;color:var(--ink);
  background:linear-gradient(180deg,#fffbea 0%,#fff0c6 100%);box-shadow:0 0 0 3px #6a4a16,0 6px 0 #6a4a16,0 12px 22px rgba(0,0,0,.3)}
.qtab{position:absolute;top:-14px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:6px 14px;border-radius:999px;font:900 11px/1 var(--body);letter-spacing:.14em;color:#173f12;
  background:linear-gradient(180deg,#e2fb9c,#9bdc4a);box-shadow:0 0 0 2.5px #1f5418,0 3px 0 #1f5418}
.expr{font:700 46px/1 var(--display);color:#1f4a1c;white-space:nowrap;letter-spacing:.01em}
.expr .op{color:#f08a1c}
.expr .ans{display:inline-grid;place-items:center;width:52px;height:52px;margin-left:2px;border-radius:16px;vertical-align:-6px;font-size:38px;color:#fff;background:linear-gradient(180deg,#ffb347,#f0801c);box-shadow:0 0 0 2.5px #8a420b,0 3px 0 #8a420b}
.qcap{margin-top:8px;font:800 13px/1.2 var(--body);color:var(--ink-soft);opacity:.85}
.qleaf{position:absolute;width:70px;height:50px;pointer-events:none}

.board{position:relative;margin-top:16px;width:358px;height:430px;border-radius:28px;padding:7px;
  background:linear-gradient(180deg,#d2f77e,#86cf3e 60%,#6cb92f);box-shadow:0 0 0 3px #1f5418,0 7px 0 #1f5418,0 16px 28px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.board > svg.field{width:100%;height:100%;border-radius:21px;overflow:hidden;box-shadow:inset 0 0 0 2px #1f5418}
.board .corner{position:absolute;pointer-events:none}

.swipe{margin:auto auto 0;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 2px var(--panel-line)}
.swipe b{font:700 18px/1 var(--display);letter-spacing:.08em;color:var(--cream)}
.swipe small{display:block;font:800 11.5px/1.2 var(--body);opacity:.75;margin-top:3px}

/* ---------- Solo (export) mode ---------- */
.solo body{background:var(--jungle-mid)}
.solo .doc-head,.solo figcaption{display:none}
.solo .row{padding:0;margin:0;display:block;max-width:none}
.solo .screen{border-radius:0;box-shadow:none}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- gradients -->
    <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be863"/><stop offset=".5" stop-color="#4fae36"/><stop offset="1" stop-color="#2a7426"/></linearGradient>
    <linearGradient id="gLeaf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3f27a"/><stop offset=".55" stop-color="#78c943"/><stop offset="1" stop-color="#3f8f2d"/></linearGradient>
    <linearGradient id="gGrass" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f7d26"/><stop offset="1" stop-color="#a6e85c"/></linearGradient>
    <linearGradient id="gRock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c4b2"/><stop offset="1" stop-color="#6b7a69"/></linearGradient>
    <radialGradient id="gMound" cx=".5" cy=".2" r=".8"><stop offset="0" stop-color="#8fd650"/><stop offset=".6" stop-color="#4fa437"/><stop offset="1" stop-color="#2f7a2a"/></radialGradient>
    <linearGradient id="gCream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#ffe598"/></linearGradient>
    <linearGradient id="gLime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2ffb0"/><stop offset=".45" stop-color="#b4ec55"/><stop offset="1" stop-color="#6ec42e"/></linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="gHead" cx=".38" cy=".28" r=".85"><stop offset="0" stop-color="#d3f994"/><stop offset=".45" stop-color="#86d64c"/><stop offset="1" stop-color="#4aa433"/></radialGradient>
    <radialGradient id="gIris" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#6b4420"/><stop offset=".6" stop-color="#2a170a"/><stop offset="1" stop-color="#120a04"/></radialGradient>
    <radialGradient id="gBlush" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8fa0" stop-opacity=".9"/><stop offset="1" stop-color="#ff8fa0" stop-opacity="0"/></radialGradient>
    <radialGradient id="gApple" cx=".36" cy=".32" r=".78"><stop offset="0" stop-color="#ff9a7e"/><stop offset=".4" stop-color="#f0473a"/><stop offset=".85" stop-color="#c22a22"/><stop offset="1" stop-color="#9c1d18"/></radialGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a6"/><stop offset=".5" stop-color="#ffcb34"/><stop offset="1" stop-color="#e3921a"/></linearGradient>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset=".55" stop-color="#f23d3d"/><stop offset="1" stop-color="#c02026"/></linearGradient>
    <linearGradient id="gTrail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4f77c" stop-opacity="0"/><stop offset="1" stop-color="#d4f77c"/></linearGradient>
    <filter id="fBlur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="fBlur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>

    <!-- leaf: base at origin, points +x, length 100 -->
    <g id="leafA">
      <path d="M0 0 C 25 -30, 72 -32, 100 0 C 72 32, 25 30, 0 0 Z" fill="url(#gLeaf)" stroke="#164a16" stroke-width="2.4"/>
      <path d="M4 0 C 40 -3, 70 -3, 96 0" stroke="#d6fba8" stroke-width="2.6" fill="none" opacity=".7" stroke-linecap="round"/>
      <path d="M28 -2 L42 -15 M48 -2 L62 -16 M68 -2 L80 -11 M28 2 L42 15 M48 2 L62 16 M68 2 L80 11" stroke="#d6fba8" stroke-width="1.6" opacity=".4" stroke-linecap="round"/>
      <path d="M18 -10 C 36 -22, 60 -24, 78 -14" stroke="#fff" stroke-width="3" fill="none" opacity=".28" stroke-linecap="round"/>
    </g>
    <g id="leafB">
      <path d="M0 0 C 25 -30, 72 -32, 100 0 C 72 32, 25 30, 0 0 Z" fill="url(#gLeaf2)" stroke="#1d5a1a" stroke-width="2.4"/>
      <path d="M4 0 C 40 -3, 70 -3, 96 0" stroke="#f0ffd0" stroke-width="2.6" fill="none" opacity=".7" stroke-linecap="round"/>
      <path d="M18 -10 C 36 -22, 60 -24, 78 -14" stroke="#fff" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/>
    </g>
    <path id="leafSil" d="M0 0 C 25 -30, 72 -32, 100 0 C 72 32, 25 30, 0 0 Z"/>
    <g id="tuft">
      <path d="M0 0 C -4 -14, -12 -22, -20 -28 C -9 -23, -2 -14, 3 0 Z M2 0 C 1 -18, 4 -30, 9 -42 C 9 -28, 8 -14, 8 0 Z M7 0 C 11 -13, 18 -22, 27 -28 C 19 -19, 13 -10, 11 0 Z" fill="url(#gGrass)" stroke="#1d5a1a" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="rock">
      <path d="M-30 0 C -33 -18, -14 -31, 4 -29 C 24 -27, 35 -13, 31 0 Z" fill="url(#gRock)" stroke="#334033" stroke-width="2.5"/>
      <ellipse cx="-6" cy="-21" rx="11" ry="4.5" fill="#fff" opacity=".45"/>
    </g>
    <g id="flower">
      <g fill="#fff" stroke="#d9d2b0" stroke-width="1"><circle cx="0" cy="-6" r="5"/><circle cx="5.7" cy="-1.9" r="5"/><circle cx="3.5" cy="4.9" r="5"/><circle cx="-3.5" cy="4.9" r="5"/><circle cx="-5.7" cy="-1.9" r="5"/></g>
      <circle r="3.8" fill="#ffc531" stroke="#c98a12" stroke-width="1"/>
    </g>

    <!-- apple (glossy), 100x100 box -->
    <symbol id="apple" viewBox="0 0 100 100">
      <ellipse cx="50" cy="93" rx="30" ry="5" fill="#000" opacity=".25"/>
      <path d="M50 30 C 30 17, 7 27, 9 54 C 11 81, 32 97, 50 89 C 68 97, 89 81, 91 54 C 93 27, 70 17, 50 30 Z" fill="url(#gApple)" stroke="#6a120e" stroke-width="3.5"/>
      <path d="M24 40 C 26 31, 34 27, 40 28" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/>
      <circle cx="22" cy="50" r="3.2" fill="#fff" opacity=".55"/>
      <path d="M50 31 C 50 22, 52 14, 58 8" stroke="#5b3a1e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M55 19 C 64 5, 83 6, 88 13 C 79 24, 64 26, 55 19 Z" fill="url(#gLeaf2)" stroke="#1d5a1a" stroke-width="2.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 100">
      <path d="M50 88 C 20 66, 6 48, 10 31 C 14 14, 37 9, 50 27 C 63 9, 86 14, 90 31 C 94 48, 80 66, 50 88 Z" fill="url(#gHeart)" stroke="#6a0f12" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="30" cy="33" rx="8" ry="12" fill="#fff" opacity=".6" transform="rotate(-30 30 33)"/>
    </symbol>
    <symbol id="heart-empty" viewBox="0 0 100 100">
      <path d="M50 88 C 20 66, 6 48, 10 31 C 14 14, 37 9, 50 27 C 63 9, 86 14, 90 31 C 94 48, 80 66, 50 88 Z" fill="rgba(0,0,0,.25)" stroke="rgba(255,246,220,.45)" stroke-width="6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="trophy" viewBox="0 0 48 48">
      <path d="M13 9 H6 C 6 18, 9 22, 15 23 M35 9 H42 C 42 18, 39 22, 33 23" stroke="#b8700f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M12 5 H36 V17 C 36 26, 30 31, 24 31 C 18 31, 12 26, 12 17 Z" fill="url(#gGold)" stroke="#8f540a" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20.5" y="30" width="7" height="7" fill="url(#gGold)" stroke="#8f540a" stroke-width="2"/>
      <rect x="13" y="36" width="22" height="7" rx="2.5" fill="url(#gGold)" stroke="#8f540a" stroke-width="2.5"/>
      <path d="M17 9 V18 C 17 22, 19 25, 21 26" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".7"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="10" y="1.6" width="4" height="5" rx="1.2"/><rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(45 12 12)"/>
        <rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(90 12 12)"/><rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(135 12 12)"/>
        <rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(180 12 12)"/><rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(225 12 12)"/>
        <rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(270 12 12)"/><rect x="10" y="1.6" width="4" height="5" rx="1.2" transform="rotate(315 12 12)"/>
      </g>
      <circle cx="12" cy="12" r="7.2" fill="none" stroke="currentColor" stroke-width="3.2"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="5" height="15" rx="1.8" fill="currentColor"/><rect x="13.5" y="4.5" width="5" height="15" rx="1.8" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.8 C 8.5 4.9, 9.4 4.4, 10.2 4.9 L 18.4 10.9 C 19.1 11.4, 19.1 12.6, 18.4 13.1 L 10.2 19.1 C 9.4 19.6, 8.5 19.1, 8.5 18.2 Z" fill="currentColor"/></symbol>
    <symbol id="i-status" viewBox="0 0 64 16">
      <path d="M2 6.5 C 7.5 1.5, 16.5 1.5, 22 6.5 L 12 15 Z" fill="currentColor"/><path d="M27 15 L 41 2 L 41 15 Z" fill="currentColor"/>
      <rect x="48" y="2" width="9" height="13" rx="2" fill="currentColor"/><rect x="50.5" y=".5" width="4" height="2" rx=".8" fill="currentColor"/>
    </symbol>
    <symbol id="i-swipe" viewBox="0 0 64 44">
      <path d="M6 38 C 14 14, 38 6, 52 14" stroke="url(#gTrail)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <circle cx="52" cy="14" r="9" fill="#fff6dc" stroke="#1f5418" stroke-width="2"/><circle cx="52" cy="14" r="14" fill="none" stroke="#fff6dc" stroke-width="2" opacity=".45"/>
      <path d="M43 2 L 45 6 M 53 -1 L 53 3 M 62 5 L 59 8" stroke="#d4f77c" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>

    <!-- Logo (title lockup) -->
    <symbol id="logo" viewBox="0 0 320 140">
      <use href="#leafB" transform="translate(58 30) rotate(-150) scale(.36)"/>
      <use href="#leafA" transform="translate(60 28) rotate(-95) scale(.3)"/>
      <use href="#leafA" transform="translate(268 92) rotate(-25) scale(.34)"/>
      <use href="#leafB" transform="translate(268 96) rotate(25) scale(.28)"/>
      <g font-family="Fredoka, Nunito, sans-serif" font-weight="700" text-anchor="middle" stroke-linejoin="round">

<script>
const NS='http://www.w3.org/2000/svg';
const measure=document.getElementById('measure');
const f=n=>n.toFixed(1);

/* ---------- Glossy tube: variable-width body built from layered circles ---------- */
function samplePath(d, step){
  const p=document.createElementNS(NS,'path'); p.setAttribute('d',d); measure.appendChild(p);
  const L=p.getTotalLength(), pts=[];
  for(let s=0;s<=L;s+=step){const q=p.getPointAtLength(s); pts.push({x:q.x,y:q.y,s});}
  const e=p.getPointAtLength(L); pts.push({x:e.x,y:e.y,s:L});
  p.remove(); return {pts,L};
}
function tube(d, o){
  const {pts,L}=samplePath(d,o.step||2);
  pts.forEach(q=>q.r=o.radius(q.s,L));
  const layer=(dx,dy,k,fill,op=1)=>`<g fill="${fill}" opacity="${op}">`+pts.map(q=>`<circle cx="${f(q.x+dx*q.r)}" cy="${f(q.y+dy*q.r)}" r="${f(q.r*k)}"/>`).join('')+'</g>';
  let out=`<g fill="${o.line}">`+pts.map(q=>`<circle cx="${f(q.x)}" cy="${f(q.y)}" r="${f(q.r+o.lw)}"/>`).join('')+'</g>';
  out+=layer(0,0,1,'#3f9a2a');
  out+=layer(-.1,-.14,.8,'#72cc3c');
  out+=layer(-.2,-.3,.5,'#a5e863',.95);
  out+=layer(-.3,-.46,.16,'#f0ffc8',.85);
  // rosette spots
  let i=0;
  for(let s=o.spotFrom; s<L-o.spotEnd; s+=o.spotGap, i++){
    const a=pts[Math.min(pts.length-1,Math.round(s/(o.step||2)))], b=pts[Math.min(pts.length-1,Math.round(s/(o.step||2))+2)];
    let tx=b.x-a.x, ty=b.y-a.y; const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m;
    let nx=-ty, ny=tx; if(ny>0||(Math.abs(ny)<.15&&nx>0)){nx=-nx;ny=-ny;}
    const k=[.45,-.05,.38,.12][i%4], rs=a.r*([.3,.22,.27,.2][i%4])*(o.spotScale||1);
    const cx=a.x+nx*a.r*k, cy=a.y+ny*a.r*k;
    out+=`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rs)}" fill="#2a6f20"/><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rs*.55)}" fill="#5cb83a"/><circle cx="${f(cx-rs*.35)}" cy="${f(cy-rs*.35)}" r="${f(rs*.22)}" fill="#fff" opacity=".45"/>`;
  }
  // belly (front-facing neck)
  if(o.belly){
    const seg=pts.filter(q=>q.s>=L-o.belly.len && q.s<=L-o.belly.stop);
    out+=`<g fill="#d9c47e">`+seg.map(q=>`<circle cx="${f(q.x+q.r*.06)}" cy="${f(q.y)}" r="${f(q.r*.6)}"/>`).join('')+'</g>';
    out+=`<g fill="#fff3c2">`+seg.map(q=>`<circle cx="${f(q.x)}" cy="${f(q.y-q.r*.04)}" r="${f(q.r*.52)}"/>`).join('')+'</g>';
    for(let j=0;j<seg.length;j+=7){const q=seg[j]; out+=`<path d="M${f(q.x-q.r*.42)} ${f(q.y)} Q ${f(q.x)} ${f(q.y+q.r*.18)} ${f(q.x+q.r*.42)} ${f(q.y)}" stroke="#d8c07a" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;}
  }
  return out;
}

/* ---------- Home mascot body ---------- */
(function(){
  const g=document.querySelector('[data-mascot-body]'); if(!g) return;
  // tail curl (right) → front of coil → back of coil → neck up into head
  const d='M 344 196 C 334 178, 352 162, 368 174 C 386 190, 378 240, 318 266 A 118 34 0 0 1 82 266 A 118 34 0 0 1 206 232 C 206 214, 202 200, 200 182';
  const ease=t=>Math.sin(Math.min(1,t)*Math.PI/2);
  g.innerHTML=tube(d,{step:2,lw:6,line:'#1b4a16',
    radius:(s,L)=> s<140 ? 5+27*ease(s/140) : 32,
    spotFrom:36, spotGap:28, spotEnd:60,
    belly:{len:62, stop:0}});
})();

/* ---------- Background & foreground jungle ---------- */
const leaf=(x,y,r,s,sy,id='leafA')=>`<use href="#${id}" transform="translate(${x} ${y}) rotate(${r}) scale(${s} ${sy??s})"/>`;
const sil=(x,y,r,s,c,op)=>`<use href="#leafSil" fill="${c}" opacity="${op}" transform="translate(${x} ${y}) rotate(${r}) scale(${s})"/>`;
function jungleBg(kind){
  let s=`<defs><radialGradient id="glow-${kind}" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#e6ff9a" stop-opacity=".45"/><stop offset="1" stop-color="#e6ff9a" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<rect width="390" height="844" fill="url(#glow-${kind})"/>`;
  // light rays
  s+=`<g fill="#f4ffd0" opacity=".09" filter="url(#fBlur6)"><path d="M120 -20 L180 -20 L60 520 L-20 520 Z"/><path d="M230 -20 L270 -20 L230 600 L170 600 Z"/><path d="M330 -20 L360 -20 L420 420 L380 420 Z"/></g>`;
  // bokeh
  [[60,180,18],[330,240,14],[300,120,10],[40,420,12],[360,520,20],[90,640,10],[210,40,16]].forEach(([x,y,r])=>s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#eaffb0" opacity=".22" filter="url(#fBlur6)"/>`);
  // far silhouettes
  const far='#1f6424';
  s+=sil(-30,120,-20,1.6,far,.55)+sil(-20,140,30,1.3,far,.5)+sil(420,160,200,1.7,far,.55)+sil(410,220,160,1.3,far,.5);
  s+=sil(-40,420,-10,1.5,far,.5)+sil(430,460,190,1.5,far,.5)+sil(-30,700,-30,1.8,far,.55)+sil(420,690,210,1.8,far,.55);
  s+=sil(160,880,-80,1.6,far,.45)+sil(240,880,-100,1.5,far,.45);
  // hanging vine top-left
  s+=`<path d="M-10 56 C 18 76, 32 130, 26 220" stroke="#2f6d22" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s+=leaf(6,64,70,.4)+leaf(18,78,-20,.34,null,'leafB')+leaf(28,112,95,.38)+leaf(30,136,-5,.3,null,'leafB')+leaf(28,180,100,.34);
  // vine top-right
  s+=`<path d="M400 120 C 376 140, 366 180, 370 230" stroke="#2f6d22" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s+=leaf(388,128,120,.36,null,'leafB')+leaf(376,150,190,.32)+leaf(368,186,100,.34,null,'leafB')+leaf(370,214,175,.3);
  if(kind==='game'){ s+=leaf(-30,380,-20,.9,.7)+leaf(420,420,200,.9,.7,'leafB'); }
  else { s+=leaf(-20,330,-30,.8,.7,'leafB')+leaf(410,350,210,.8,.7); }
  return s;
}
function jungleFg(kind){
  let s='';
  // big glossy leaves poking in from the bottom corners
  s+=leaf(-40,860,-60,1.1,.8)+leaf(-30,850,-25,1.0,.75,'leafB')+leaf(-50,800,-5,.8,.6);
  s+=leaf(430,860,-120,1.1,.8,'leafB')+leaf(420,850,-155,1.0,.75)+leaf(440,800,-175,.8,.6,'leafB');
  s+=`<use href="#tuft" transform="translate(60 846) scale(1.4)"/><use href="#tuft" transform="translate(330 848) scale(1.3)"/>`;
  return s;
}
document.querySelectorAll('[data-bg]').forEach(el=>el.innerHTML=jungleBg(el.dataset.bg));
document.querySelectorAll('[data-fg]').forEach(el=>el.innerHTML=jungleFg(el.dataset.fg));

/* ---------- Game board: grid logic in, glossy snake out ---------- */
const BOARDS={
  phone:{cols:10,rows:12,
    snake:[[6,4],[5,4],[4,4],[3,4],[3,5],[3,6],[2,6],[1,6],[1,7],[1,8],[2,8],[3,8],[4,8]],
    apples:[{x:8,y:2,n:11},{x:7,y:8,n:16},{x:5,y:10,n:13}]}
};
function renderBoard(el,b){
  const S=100,W=b.cols*S,H=b.rows*S,c=v=>v*S+S/2;
  el.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let g=`<rect width="${W}" height="${H}" fill="#245a2a"/>`;
  for(let y=0;y<b.rows;y++)for(let x=0;x<b.cols;x++) if((x+y)%2) g+=`<rect x="${x*S}" y="${y*S}" width="${S}" height="${S}" fill="#2b6631"/>`;
  // grass flecks (decorative texture, low contrast)
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<46;i++){const x=rnd()*W,y=rnd()*H; g+=`<path d="M${f(x)} ${f(y)} l -4 -12 M${f(x+5)} ${f(y)} l 2 -15 M${f(x+10)} ${f(y)} l 6 -10" stroke="#3f8a3a" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>`;}
  g+=`<rect width="${W}" height="${H}" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="40" rx="30"/>`;

  // snake path tail → head, rounded turns
  const pts=b.snake.map(([x,y])=>[c(x),c(y)]).reverse();
  const mid=(a,q)=>[(a[0]+q[0])/2,(a[1]+q[1])/2];
  let d=`M${pts[0].join(' ')}`;
  for(let i=1;i<pts.length-1;i++){
    const [a,p,n]=[pts[i-1],pts[i],pts[i+1]];
    const straight=(a[0]===p[0]&&p[0]===n[0])||(a[1]===p[1]&&p[1]===n[1]);
    d+=straight?` L${p.join(' ')}`:` L${mid(a,p).join(' ')} Q${p.join(' ')} ${mid(p,n).join(' ')}`;
  }
  d+=` L${pts[pts.length-1].join(' ')}`;
  // extend tail tip half a cell backwards
  const [t0,t1]=[pts[0],pts[1]]; const tip=[t0[0]-(t1[0]-t0[0])*.45, t0[1]-(t1[1]-t0[1])*.45];
  d=`M${tip.join(' ')} L`+d.slice(1);

  const rad=(s,L)=> s<170 ? 9+30*Math.sin(Math.min(1,s/170)*Math.PI/2) : 39;
  const sp=samplePath(d,4);
  const shadow=`<g fill="#000" opacity=".28">`+sp.pts.map(q=>`<circle cx="${f(q.x+6)}" cy="${f(q.y+14)}" r="${f(rad(q.s,sp.L)+6)}"/>`).join('')+'</g>';
  const body=tube(d,{step:2.5,lw:7,line:'#1b4a16',radius:rad,
    spotFrom:50, spotGap:44, spotEnd:70, spotScale:1.45});

  const [hx,hy]=pts[pts.length-1],[nx,ny]=pts[pts.length-2];
  const ang=Math.atan2(hy-ny,hx-nx)*180/Math.PI;
  const head=`<use href="#game-head" transform="translate(${hx} ${hy}) rotate(${ang}) scale(1.36)"/>
    <ellipse cx="${hx-16}" cy="${hy-30}" rx="22" ry="9" fill="#fff" opacity=".45" transform="rotate(-18 ${hx-14} ${hy-26})"/>`;

  const apples=b.apples.map(a=>`
    <ellipse cx="${c(a.x)}" cy="${c(a.y)+50}" rx="44" ry="10" fill="#000" opacity=".25"/>
    <use href="#apple" x="${c(a.x)-66}" y="${c(a.y)-74}" width="132" height="132"/>
    <text x="${c(a.x)}" y="${c(a.y)+22}" text-anchor="middle" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="52"
      fill="#fff" stroke="#6a120e" stroke-width="10" paint-order="stroke" stroke-linejoin="round">${a.n}</text>`).join('');

  el.innerHTML=g+apples+shadow+body+head;
}
document.querySelectorAll('[data-board]').forEach(el=>renderBoard(el,BOARDS[el.dataset.board]));

/* ---------- ?screen=… solo export ---------- */
const solo=new URLSearchParams(location.search).get('screen');
if(solo){document.documentElement.classList.add('solo');document.querySelectorAll('.frame').forEach(fr=>{if(fr.dataset.screen!==solo)fr.remove();});}
</script>
