<header class="review-header">

<h1>Seven screens. One little world.</h1>
<p>The PRD flow, built from the <a href="design-system.html">design system</a>. Phone Home is preserved as approved. Portrait phones and landscape tablets, with a wider 20 × 16 tablet board.</p>
<div class="toolbar"><div class="segmented" aria-label="Device size"><button data-device="phone" aria-pressed="true">Phone · 390 × 844</button><button data-device="tablet" aria-pressed="false">Tablet · 1024 × 768</button></div><div class="segmented" aria-label="Review layout"><button data-view="gallery" aria-pressed="true">All screens</button><button data-view="single" aria-pressed="false">Click through</button></div><a class="review-button" href="screen-designs.md">Design notes ↗</a><span class="review-note">Phone: portrait · Tablet: landscape · Review only</span></div>

<script>
const screens=['home','modes','classic','mdas','pause','results','settings'];
const titles={home:'Home',modes:'Mode selection',classic:'Classic gameplay',mdas:'MDAS gameplay',pause:'Pause',results:'Game over',settings:'Settings'};
const descriptions={home:'Approved phone Home unchanged. Tablet uses the same character, title, PLAY button and best-score panel.',modes:'PLAY leads here. Two clearly described modes, separate best scores, one tap to begin.',classic:'One apple, score and best score. Swipe-only play with square grid cells.',mdas:'The question stays visible. Five lives, three equally styled answer apples and no timer.',pause:'Keep the game visible beneath a quiet scrim. Resume, restart or return home.',results:'Final score and best score, then a clear invitation to retry. No invented rewards or extra currencies.',settings:'Only sound effects and music. These review toggles are kept in memory.'};
const params=new URLSearchParams(location.search);let device=params.get('device')==='tablet'?'tablet':'phone',view=params.get('view')==='single'?'single':'gallery',active=screens.includes(params.get('screen'))?params.get('screen'):'home',gameMode=params.get('mode')==='classic'?'classic':'mdas';
const preferences={sound:true,music:false};const icon=(name,extra='')=>`<svg aria-hidden="true" ${extra}><use href="#${name}"/></svg>`;
function leaves(){return `<svg class="small-leaves left" viewBox="0 0 64 44" aria-hidden="true"><use href="#leaf" transform="translate(35 40) rotate(-145) scale(.36)"/><use href="#leaf" transform="translate(35 40) rotate(-85) scale(.30)"/></svg><svg class="small-leaves right" viewBox="0 0 64 44" aria-hidden="true"><use href="#leaf" transform="translate(12 40) rotate(-35) scale(.36)"/><use href="#leaf" transform="translate(12 40) rotate(-90) scale(.30)"/></svg>`}
function logo(compact=false){return `<svg class="logo ${compact?'compact':''}" viewBox="0 0 320 150" role="img" aria-label="Snake and Math"><use href="#leaf" transform="translate(44 55) rotate(-135) scale(.37)"/><use href="#leaf" transform="translate(278 67) rotate(-65) scale(.36)"/><g text-anchor="middle" font-size="68" stroke-width="7"><text x="160" y="65" fill="url(#gCream)">SNAKE</text><text x="160" y="131" fill="url(#gLime)">&amp; MATH</text></g></svg>`}
function statusBar(){return `<div class="status"><span>9:41</span><span class="status-icons">${icon('wifi')}${icon('signal')}${icon('battery')}</span></div>`}
function primary(label,action,mode='',symbol='i-play'){return `<button class="primary" data-action="${action}" ${mode?`data-mode="${mode}"`:''}>${symbol?icon(symbol):''}<span>${label}</span></button>`}
function secondary(label,action,symbol='',extra=''){return `<button class="secondary ${extra}" data-action="${action}">${symbol?icon(symbol):''}<span>${label}</span></button>`}
function pageTop(title){return `<div class="page-top"><button class="icon-button" data-action="home" aria-label="Return home">${icon('back')}</button><h2>${title}</h2><span></span></div>`}
function best(value=1280){return `<div class="panel best-panel">${icon('trophy')}<div><small>BEST SCORE</small><strong>${value.toLocaleString('en-US')}</strong></div></div>`}
function home(){if(device==='phone')return `<img class="home-reference" src="../assets/mockups/home-v3.png" alt="Approved Snake and Math home screen with cartoon mascot, PLAY, best score, Themes and Settings"><button class="home-hotspot play" data-action="modes" aria-label="Play"></button><button class="home-hotspot settings" data-action="settings" aria-label="Settings"></button><button class="home-hotspot themes" data-action="themes" aria-label="Themes, coming later"></button>`;return `${statusBar()}<div class="tablet-home"><div class="home-hero">${logo()}<p class="subcopy">A little game of growth</p><img class="home-mascot" src="../assets/game/snake_mascot_v1.png" alt="Friendly coiled green snake mascot"></div><div class="home-actions">${primary('PLAY','modes')}${best()}<div class="secondary-row">${secondary('THEMES','themes','i-palette')}${secondary('SETTINGS','settings','i-gear')}</div></div></div>`}
function modes(){return `${statusBar()}<div class="product-content">${pageTop('LET’S PLAY')}<div class="mode-intro"><p class="eyebrow">TWO WAYS TO GROW</p><h1>CHOOSE YOUR<br>MODE</h1><p class="subcopy">A little fun. A little brain food.</p></div><div class="mode-list"><article class="mode-card"><div class="mode-emblem">${icon('apple')}</div><h2>CLASSIC APPLE</h2><p class="subcopy">Collect apples. Keep growing.<br>Watch out for walls and yourself!</p><div class="mode-bottom"><div class="mode-best">BEST SCORE<strong>1,280</strong></div>${primary('PLAY CLASSIC','classic','','i-play')}</div></article><article class="mode-card"><div class="mode-emblem math-emblem" aria-hidden="true">× ÷</div><h2>MDAS LEARNING</h2><p class="subcopy">Solve the question. Find its apple.<br>Five lives to keep learning.</p><div class="mode-bottom"><div class="mode-best">BEST SCORE<strong>360</strong></div>${secondary('PLAY MDAS','mdas','i-play')}</div></article></div><p class="picker-hint">Swipe to steer in either mode.</p></div>`}
function score(mode){return `<div class="score-panel panel"><div><small>SCORE</small><strong>240</strong></div><div><small>BEST</small><strong>${mode==='mdas'?'360':'1,280'}</strong></div></div>`}
function board(mode){return `<div class="board-frame"><canvas width="${device==='tablet'?1000:600}" height="800" data-columns="${device==='tablet'?20:12}" data-board="${mode}" role="img" aria-label="${device==='tablet'?20:12} by 16 game board with a smooth green snake and ${mode==='mdas'?'answer apples 11, 16 and 13':'one red apple'}"></canvas><svg class="board-sprig tl" viewBox="0 0 44 44" aria-hidden="true"><use href="#leaf" transform="translate(30 32) rotate(-145) scale(.30)"/><use href="#leaf" transform="translate(30 32) rotate(-80) scale(.25)"/></svg><svg class="board-sprig br" viewBox="0 0 44 44" aria-hidden="true"><use href="#leaf" transform="translate(30 32) rotate(-145) scale(.30)"/><use href="#leaf" transform="translate(30 32) rotate(-80) scale(.25)"/></svg></div>`}
function game(mode,background=false,lost=false){return `${statusBar()}<div class="game-shell ${mode==='classic'?'classic-game':''}" ${background?'inert aria-hidden="true"':''}><div class="game-header">${logo(true)}${score(mode)}<button class="icon-button pause-button" data-action="pause" data-mode="${mode}" aria-label="Pause game">${icon('i-pause')}</button></div><div class="game-layout"><aside class="game-info"><div class="mode-row"><span class="mode-chip">${icon('leaf','viewBox="0 -32 100 64"')}${mode==='mdas'?'MDAS <em>LEARNING</em>':'CLASSIC <em>APPLE</em>'}</span>${mode==='mdas'?`<div class="lives" role="img" aria-label="${lost?'No lives remaining':'Five lives remaining'}">${Array.from({length:5},()=>icon(lost?'heart-lost':'heart')).join('')}</div>`:''}</div>${mode==='mdas'?`<div class="question">${leaves()}<small>FIND THE ANSWER</small><strong>5 + 3 × 2 = ?</strong></div><p class="game-caption">Solve the question, then guide your snake to its answer apple.<br><br>Take your time. There’s no timer.</p>`:`<div class="classic-copy"><h2>Collect apples.<br class="tablet-break"> Keep growing.</h2><p class="subcopy">Stay clear of the walls<br>and your own body.</p></div><p class="game-caption">Every apple helps you grow.<br>How far can you go?</p>`}</aside><div class="board-column">${board(mode)}<div class="swipe">SWIPE TO MOVE</div></div></div></div>`}
function pause(){return `${game(gameMode,true)}<div class="state-scrim"><div class="state-card" role="dialog" aria-label="Game paused">${leaves()}<div class="state-icon">${icon('i-pause')}</div><p class="eyebrow">TAKE A BREATHER</p><h1>PAUSED</h1><p class="subcopy">Your garden can wait.<br>Ready when you are.</p>${primary('RESUME','resume')}<div class="state-actions">${secondary('RESTART','restart','restart')}${secondary('HOME','home','home')}</div></div></div>`}
function results(){return `${game(gameMode,true,true)}<div class="state-scrim"><div class="state-card result-card" role="dialog" aria-label="Game over">${leaves()}<div class="state-icon">${icon('trophy')}</div><p class="eyebrow">${gameMode==='mdas'?'MDAS LEARNING':'CLASSIC APPLE'}</p><h1>GAME OVER</h1><p class="subcopy">Ready for another round?</p><div class="result-score"><div><small>YOUR SCORE</small><strong>240</strong></div><div><small>BEST SCORE</small><strong>${gameMode==='mdas'?'360':'1,280'}</strong></div></div>${primary('TRY AGAIN','restart')}<div class="state-actions">${secondary('HOME','home','home')}</div></div></div>`}
function settings(){return `${statusBar()}<div class="product-content">${pageTop('SETTINGS')}<div class="settings-layout"><div class="settings-intro"><div class="settings-emblem">${icon('i-gear')}</div><h1>MAKE YOURSELF<br>AT HOME</h1><p class="subcopy">A little quieter?<br>Set the sound your way.</p></div><div><div class="settings-panel panel">${setting('sound','Sound effects','Apples, answers and little wins.','sound')}${setting('music','Music','A tune for your time in the garden.','music')}</div><p class="settings-footer">Changes apply to both game modes.</p>${secondary('BACK TO HOME','home','home','settings-home')}</div></div></div>`}
function setting(key,label,description,symbol){return `<div class="setting-row">${icon(symbol)}<div class="setting-name"><strong>${label}</strong><small>${description}</small></div><button class="switch" role="switch" aria-label="${label}" aria-checked="${preferences[key]}" data-preference="${key}"></button></div>`}
const renderers={home,modes,classic:()=>game('classic'),mdas:()=>game('mdas'),pause,results,settings};
function frame(name){return `<div class="app-screen ${device==='tablet'?'tablet':''} ${name==='home'&&device==='phone'?'phone-home':''}" data-screen="${name}">${renderers[name]()}${name==='home'&&device==='phone'?'':'<div class="gesture-bar"></div>'}</div>`}
function setURL(){const p=new URLSearchParams({device,view,screen:active,mode:gameMode});history.replaceState(null,'','?'+p)}
function render(){document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.device===device));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));const root=document.querySelector('#review');if(view==='gallery'){root.className='gallery '+(device==='tablet'?'tablet-gallery':'');root.innerHTML=screens.map((name,i)=>`<figure class="artboard"><div class="artboard-heading"><h2>${String(i+1).padStart(2,'0')} / ${titles[name]}</h2><button data-open="${name}">Open ↗</button></div><div class="viewport">${frame(name)}</div><figcaption>${descriptions[name]}</figcaption></figure>`).join('')}else{root.className='single-stage';root.innerHTML=`<div class="viewport">${frame(active)}</div>`}document.querySelector('#review-dock').hidden=view!=='single';document.querySelector('#dock-label').textContent=titles[active];document.querySelector('#review-state').innerHTML=view==='single'?`<b>${titles[active]}</b> · ${device==='phone'?'390 × 844':'1024 × 768'} · ${active==='settings'?`Sound ${preferences.sound?'on':'off'}, music ${preferences.music?'on':'off'}`:active==='pause'||active==='results'?`${gameMode==='mdas'?'MDAS':'Classic'} session · frozen review state`:'Visual review, sample state'}`:`7 ${device==='phone'?'phone':'tablet'} screens · Open a screen to click through the flow.`;fit();drawBoards();setURL()}
function fit(){const w=device==='phone'?390:1024,h=device==='phone'?844:768;document.querySelectorAll('.viewport').forEach(v=>{const available=view==='gallery'?v.parentElement.clientWidth:Math.min(innerWidth-40,device==='phone'?430:1200);const scale=view==='single'?Math.min(1,available/w,(innerHeight-260)/h):Math.min(device==='phone'?.78:.63,available/w);v.style.width=w*scale+'px';v.style.height=h*scale+'px';v.firstElementChild.style.transform=`scale(${scale})`})}
function go(name,mode){if(mode)gameMode=mode;if(name==='classic'||name==='mdas')gameMode=name;active=name;view='single';render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.device){device=b.dataset.device;render()}else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.open){go(b.dataset.open)}else if(b.dataset.cycle){active=screens[(screens.indexOf(active)+Number(b.dataset.cycle)+7)%7];render()}else if(b.dataset.preference){const key=b.dataset.preference;preferences[key]=!preferences[key];b.setAttribute('aria-checked',preferences[key]);document.querySelector('#review-state').innerHTML=`<b>Settings</b> · Sound ${preferences.sound?'on':'off'}, music ${preferences.music?'on':'off'} · review only, not persisted`}else if(b.dataset.action){const a=b.dataset.action;if(a==='themes'){const screen=b.closest('.app-screen');screen.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent='More snake styles are planned for later.';screen.append(t);setTimeout(()=>t.remove(),2600)}else if(a==='resume'||a==='restart'){go(gameMode)}else go(a,b.dataset.mode)}});
window.addEventListener('resize',fit);window.addEventListener('popstate',()=>location.reload());document.addEventListener('keydown',e=>{if(view!=='single'||!['ArrowLeft','ArrowRight'].includes(e.key)||e.target.matches('input,textarea,select,[contenteditable]'))return;e.preventDefault();active=screens[(screens.indexOf(active)+(e.key==='ArrowRight'?1:6))%7];render()});
// Renderer and icon symbols inserted below. No game engine is implemented in this screen review.
</script>
<script>
window.paintApple=function(ctx,x,y,k,v){ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.fillStyle='#09201966';ctx.beginPath();ctx.ellipse(1,12,17,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#D83D26';ctx.beginPath();ctx.moveTo(0,-13);ctx.bezierCurveTo(-25,-25,-25,20,-7,20);ctx.quadraticCurveTo(0,24,7,20);ctx.bezierCurveTo(25,20,25,-25,0,-13);ctx.fill();ctx.fillStyle='#F17D54';ctx.beginPath();ctx.ellipse(-10,-4,3,6,.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#749B36';ctx.fillRect(-1,-23,3,10);ctx.beginPath();ctx.ellipse(7,-23,8,4,-.5,0,Math.PI*2);ctx.fill();if(v!=null){ctx.fillStyle='#FFF4D3';ctx.strokeStyle='#9A271E';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.font="800 19px 'Baloo 2', system-ui";ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText(String(v),0,5);ctx.fillText(String(v),0,5);}ctx.restore();};
// board preview: renderer ported from docs/assets/game/snake-grid-gameplay-prototype.html (smooth joins v3), drawn on the system board
function drawBoards(){document.querySelectorAll('[data-board]').forEach(cv=>{
  const ctx=cv.getContext('2d'), CELL=50, C=Number(cv.dataset.columns), R=16, W=CELL*.7;
  const atlas=new Image(); atlas.src='../assets/game/path-snake/snake_path_parts_v1.png';
  const HEAD=[32,159,647,436]; let head=null;
  function prepareHead(){ // feather rear 42% (compositing only; no pixel reads, so it works from file://)
    const [x,y,w,h]=HEAD,c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');
    q.drawImage(atlas,x,y,w,h,0,0,w,h);q.globalCompositeOperation='destination-in';
    const m=q.createLinearGradient(0,0,w*.42,0);m.addColorStop(0,'rgba(0,0,0,0)');m.addColorStop(.12,'rgba(0,0,0,0)');m.addColorStop(1,'rgba(0,0,0,1)');q.fillStyle=m;q.fillRect(0,0,w,h);head=c;}
  // tail → head cells (logical grid)
  const left=C===20?5:3,right=C===20?14:8,cells=[[right,12],[right,11],[right,10]];
  for(let x=right-1;x>=left;x--)cells.push([x,10]);for(let y=9;y>=5;y--)cells.push([left,y]);for(let x=left+1;x<=right;x++)cells.push([x,5]);
  function track(){const raw=cells.map(([x,y])=>({x:(x+.5)*CELL,y:(y+.5)*CELL})),pts=[];const add=(x,y)=>{if(!pts.length||Math.hypot(pts.at(-1).x-x,pts.at(-1).y-y)>.001)pts.push({x,y});};add(raw[0].x,raw[0].y);
    for(let i=1;i<raw.length-1;i++){const v=raw[i],a=raw[i-1],b=raw[i+1],l1=Math.hypot(v.x-a.x,v.y-a.y),l2=Math.hypot(b.x-v.x,b.y-v.y),r=Math.min(CELL*.36,l1*.45,l2*.45),ax=v.x-(v.x-a.x)/l1*r,ay=v.y-(v.y-a.y)/l1*r,bx=v.x+(b.x-v.x)/l2*r,by=v.y+(b.y-v.y)/l2*r;add(ax,ay);for(let j=1;j<=10;j++){const t=j/10,u=1-t;add(u*u*ax+2*u*t*v.x+t*t*bx,u*u*ay+2*u*t*v.y+t*t*by);}}
    add(raw.at(-1).x,raw.at(-1).y);let total=0;pts.forEach((p,i)=>{if(i)total+=Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y);p.s=total;});return{points:pts,total};}
  function at(t,s){const ps=t.points;if(s<0){const a=ps[0],b=ps[1],g=Math.atan2(b.y-a.y,b.x-a.x);return{x:a.x+Math.cos(g)*s,y:a.y+Math.sin(g)*s,angle:g};}s=Math.min(t.total,s);let lo=0,hi=ps.length-1;while(lo+1<hi){const m=(lo+hi)>>1;if(ps[m].s<s)lo=m;else hi=m;}const a=ps[lo],b=ps[hi],k=(s-a.s)/(b.s-a.s||1);return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,angle:Math.atan2(b.y-a.y,b.x-a.x)};}
  function body(sample,start,end,w){const layer=document.createElement('canvas');layer.width=cv.width;layer.height=cv.height;const g=layer.getContext('2d'),sec=[],n=Math.max(12,Math.ceil((end-start)/2));
    for(let i=0;i<=n;i++){const d=start+(end-start)*i/n,p=sample(d),a=sample(Math.max(start,d-1)),b=sample(Math.min(end,d+1)),ang=Math.atan2(b.y-a.y,b.x-a.x),t=Math.max(0,Math.min(1,(d-start)/(w*1.5))),r=w*.5*Math.sqrt(1-(1-t)*(1-t));sec.push({x:p.x,y:p.y,nx:-Math.sin(ang),ny:Math.cos(ang),r});}
    const ribbon=(lo,hi)=>{g.beginPath();sec.forEach((p,i)=>{const x=p.x+p.nx*p.r*lo,y=p.y+p.ny*p.r*lo;i?g.lineTo(x,y):g.moveTo(x,y);});for(let i=sec.length-1;i>=0;i--){const p=sec[i];g.lineTo(p.x+p.nx*p.r*hi,p.y+p.ny*p.r*hi);}g.closePath();};
    g.save();ribbon(-1,1);g.fillStyle='#8ABA16';g.fill();g.clip();
    for(let k=0;k<28;k++){const a=-1+k*2/28,b=-1+(k+1)*2/28,t=(a+b)/2,vol=Math.pow(Math.max(0,1-t*t),.6),li=Math.max(0,1-Math.abs(t+.27)/1.15);ribbon(a-.006,b+.006);g.fillStyle=`rgb(${Math.round(115+39*vol+9*li)},${Math.round(157+46*vol+7*li)},${Math.round(13+9*vol)})`;g.fill();}
    let idx=0;for(let d=end-w*.75;d>start+w*.85;d-=w*.9,idx++){const p=sample(d),lane=(idx%2===0?-.24:.23)*w,rad=w*(.18+.025*Math.sin(idx*2.1));g.save();g.translate(p.x-Math.sin(p.angle)*lane,p.y+Math.cos(p.angle)*lane);g.rotate(p.angle+.22*Math.sin(idx*1.7));g.fillStyle=idx%3===0?'#649A16':'#72A71A';g.beginPath();g.ellipse(0,0,rad*1.24,rad*.85,0,0,7);g.fill();g.restore();}
    g.restore();ctx.drawImage(layer,0,0);}
  function draw(){
    ctx.fillStyle='#01411E';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#0D5426';ctx.lineWidth=1;
    for(let x=1;x<C;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,cv.height);ctx.stroke();}for(let y=1;y<R;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(cv.width,y*CELL);ctx.stroke();}
    (cv.dataset.board==='mdas'?(C===20?[[17,3,11],[3,8,16],[16,13,13]]:[[10,3,11],[1,8,16],[9,13,13]]):[[C-2,3,null]]).forEach(([x,y,v])=>window.paintApple(ctx,(x+.5)*CELL,(y+.5)*CELL,CELL/50,v));
    const t=track(),sample=s=>at(t,s);
    ctx.save();ctx.translate(0,4);ctx.strokeStyle='#07161166';ctx.lineWidth=W*.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();for(let i=0;i<=120;i++){const p=sample(t.total*i/120);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);}ctx.stroke();ctx.restore();
    body(sample,-W*.5,t.total-W*.2,W);
    if(head){const p=sample(t.total),h=W*1.1,w=h*HEAD[2]/HEAD[3];ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.drawImage(head,-w*.59,-h/2,w,h);ctx.restore();}cv.dataset.ready=head?'true':'false';
  }
  setTimeout(draw); atlas.onload=()=>{prepareHead();draw();}; document.fonts&&document.fonts.ready.then(()=>setTimeout(draw));
});}

render();document.fonts.ready.then(drawBoards);
