function fit(){const w=device==='tablet'?1024:390,h=device==='tablet'?768:844,available=Math.min(innerWidth-32,1200),scale=Math.max(.15,Math.min(1,available/w,(innerHeight-240)/h));document.querySelector('.viewport').style.width=w*scale+'px';document.querySelector('.viewport').style.height=h*scale+'px';stage.style.transform='scale('+scale+')'}

function tick(timestamp){if(paused||document.hidden){lastTimestamp=timestamp;requestAnimationFrame(tick);return}if(lastTimestamp!==null)elapsed=(elapsed+Math.min(50,Math.max(0,timestamp-lastTimestamp)))%DURATION;lastTimestamp=timestamp;draw(elapsed/DURATION);requestAnimationFrame(tick)}
playButton.addEventListener('click',()=>{paused=!paused;lastTimestamp=null;sync()});document.querySelector('#restart').addEventListener('click',()=>{elapsed=0;lastTimestamp=null;paused=false;sync();draw(0)});slider.addEventListener('input',()=>{elapsed=Number(slider.value)/1000*DURATION;if(elapsed===DURATION)elapsed=DURATION*.999;paused=true;lastTimestamp=null;draw(elapsed/DURATION);sync()});document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{device=b.dataset.device;configure()}));document.addEventListener('visibilitychange',()=>{lastTimestamp=null});window.addEventListener('resize',fit);motionPreference.addEventListener('change',()=>{paused=motionPreference.matches;lastTimestamp=null;sync()});
const mascotSource=new Image();mascotSource.onload=()=>{prepareFace(mascotSource);draw(elapsed/DURATION)};mascotSource.src='loading-assets/mascot-head.png';configure();requestAnimationFrame(tick);

</script>
</body></html>
