<rect x="211.0" y="222" width="106.0" height="22" rx="2" fill="#FCFAF1"/>
<text x="264" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">CREATE ROUND</text>
<rect x="430.75" y="278" width="98.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="480" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">FIRST SWIPE</text>
<rect x="695.5" y="108" width="121.0" height="40" rx="2" fill="#FCFAF1"/>
<text x="756" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">BORDER WRAP /</text>
<text x="756" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">MDAS BODY PASS</text>
<rect x="82.5" y="432" width="91.0" height="40" rx="2" fill="#FCFAF1"/>
<text x="128" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">PAUSE /</text>
<text x="128" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">BACKGROUND</text>
<rect x="611.5" y="456" width="121.0" height="40" rx="2" fill="#FCFAF1"/>
<text x="672" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">PAUSE / BACK /</text>
<text x="672" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">BACKGROUND</text>
<rect x="128.25" y="614" width="143.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="200" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">RESUME: WAS READY</text>
<rect x="676.75" y="614" width="158.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="756" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">RESUME: WAS RUNNING</text>
<rect x="377.75" y="402" width="68.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="412" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">RESTART</text>
<g data-node="READY"><rect x="80" y="284" width="248" height="112" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="204.0" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">READY</text>
<text x="204.0" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">No moving loop</text>
</g>
<g data-node="RUNNING"><rect x="632" y="284" width="248" height="112" rx="8" fill="#F0F6CF" stroke="#155E2B" stroke-width="1.4"/>
<text x="756.0" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">RUNNING</text>
<text x="756.0" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">One owned tick job</text>
</g>
<g data-node="PAUSED"><rect x="356" y="596" width="248" height="112" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="480.0" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">PAUSED</text>
<text x="480.0" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">Frozen interval and queued turns</text>
</g>
<line x1="48" y1="840" x2="912" y2="840" stroke="#9BAA9E"/>
<text x="48" y="864" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">Resume is explicit and restores READY or RUNNING according to the state before pausing.</text>
<text x="48" y="882" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">Borders and MDAS self-overlap keep RUNNING; neither deducts lives nor resets the round.</text></svg>
