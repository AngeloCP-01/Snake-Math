<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-session-controls-title 04-session-controls-desc" id="d-04-session-controls-root"><title id="04-session-controls-title">Session lifecycle: start, pause and resume</title><desc id="04-session-controls-desc">A first swipe starts a ready round; pausing retains the prior status and returning to the foreground never resumes automatically.</desc><defs>
      <style>#d-04-session-controls-root { color: #023E21; }
      #d-04-session-controls-root .diagram-container { width:100%;overflow-x:auto; }
      @media print {
#d-04-session-controls-root .diagram-container { overflow-x:visible; }
}</style><marker id="d-04-session-controls-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47634F"/></marker><marker id="d-04-session-controls-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#155E2B"/></marker><marker id="d-04-session-controls-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47634F"/></marker></defs><rect width="960" height="940" fill="#FCFAF1"/><text x="48" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#023E21" text-anchor="start">Session lifecycle: start, pause and resume</text>
<text x="48" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">SNAKE &amp; MATH / PROPOSED ARCHITECTURE</text>
