<text x="80" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">The single owned tick job runs only while foreground-eligible and RUNNING.</text>
<line x1="48" y1="720" x2="912" y2="720" stroke="#9BAA9E"/>
<text x="48" y="744" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">Solid: request/command. Dashed: returned state or response. Time flows downward.</text>
<text x="48" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">One authoritative state; no UI or renderer decides gameplay outcomes.</text></svg>
