<path d="M 880 476 L 912 476 Q 920 476 920 468 L 920 120 Q 920 112 912 112 L 264 112 Q 256 112 256 120 L 256 140" fill="none" stroke="#47634F" stroke-width="1.5" marker-end="url(#d-05-session-outcomes-arrow)"/>
<path d="M 64 188 L 48 188 Q 40 188 40 196 L 40 812 Q 40 820 48 820 L 352 820" fill="none" stroke="#47634F" stroke-width="1.5" marker-end="url(#d-05-session-outcomes-arrow)"/>
