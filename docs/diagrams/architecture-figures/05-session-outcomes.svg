<rect x="516.5" y="260" width="151.0" height="40" rx="2" fill="#FCFAF1"/>
<text x="592" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">CLASSIC SELF-HIT /</text>
<text x="592" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">5TH WRONG ANSWER</text>
<rect x="730.5" y="358" width="91.0" height="22" rx="2" fill="#FCFAF1"/>
<text x="776" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">BOARD FULL</text>
<rect x="198.25" y="330" width="83.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="240" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">TRY AGAIN</text>
<rect x="550.25" y="78" width="83.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="592" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">TRY AGAIN</text>
<rect x="127.75" y="782" width="128.5" height="22" rx="2" fill="#FCFAF1"/>
<text x="192" y="796" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">HOME / DISPOSAL</text>
<rect x="200" y="660" width="76.0" height="40" rx="2" fill="#FCFAF1"/>
<text x="208" y="674" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">HOME /</text>
<text x="208" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">DISPOSAL</text>
<rect x="488" y="638" width="46.0" height="22" rx="2" fill="#FCFAF1"/>
<text x="496" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">HOME</text>
<rect x="665.0" y="690" width="46.0" height="22" rx="2" fill="#FCFAF1"/>
<text x="688" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">HOME</text>
<g data-node="READY"><rect x="64" y="140" width="224" height="96" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="176.0" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">READY</text>
<text x="176.0" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">Retry waits for a swipe</text>
</g>
<g data-node="RUNNING"><rect x="656" y="140" width="224" height="96" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="768.0" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">RUNNING</text>
<text x="768.0" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">Active round</text>
</g>
<g data-node="PAUSED"><rect x="64" y="428" width="224" height="96" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="176.0" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">PAUSED</text>
<text x="176.0" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">Can return Home</text>
</g>
<g data-node="GAME_OVER"><rect x="352" y="428" width="256" height="96" rx="8" fill="#F0F6CF" stroke="#155E2B" stroke-width="1.4"/>
<text x="480.0" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">GAME_OVER</text>
<text x="480.0" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">Classic self-hit / MDAS zero lives</text>
</g>
<g data-node="COMPLETED"><rect x="656" y="428" width="224" height="96" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="768.0" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">COMPLETED</text>
<text x="768.0" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">Classic board filled</text>
</g>
<g data-node="END"><rect x="352" y="780" width="256" height="80" rx="8" fill="#FFFFFF" stroke="#9BAA9E" stroke-width="1.4"/>
<text x="480.0" y="816" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#023E21" text-anchor="middle">Session disposed</text>
<text x="480.0" y="840" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="middle">End marker, not a GameStatus</text>
</g>
<line x1="48" y1="900" x2="912" y2="900" stroke="#9BAA9E"/>
<text x="48" y="924" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">All four original disposal paths remain: READY, PAUSED, GAME_OVER and COMPLETED.</text>
<text x="48" y="942" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">Retry keeps the selected mode, MDAS difficulty and board profile; a new round starts READY.</text></svg>
