<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-session-outcomes-title 05-session-outcomes-desc" id="d-05-session-outcomes-root"><title id="05-session-outcomes-title">Session lifecycle: results, retry and disposal</title><desc id="05-session-outcomes-desc">Classic self-hit or five incorrect MDAS answers cause game over; Classic board completion succeeds; retry returns to ready and Home disposes the session.</desc><defs>
      <style>#d-05-session-outcomes-root { color: #023E21; }
      #d-05-session-outcomes-root .diagram-container { width:100%;overflow-x:auto; }
      @media print {
#d-05-session-outcomes-root .diagram-container { overflow-x:visible; }
}</style><marker id="d-05-session-outcomes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47634F"/></marker><marker id="d-05-session-outcomes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#155E2B"/></marker><marker id="d-05-session-outcomes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47634F"/></marker></defs><rect width="960" height="1000" fill="#FCFAF1"/><text x="48" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#023E21" text-anchor="start">Session lifecycle: results, retry and disposal</text>
<text x="48" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#47634F" text-anchor="start">SNAKE &amp; MATH / PROPOSED ARCHITECTURE</text>
